openapi: 3.0.0
info:
  title: NexusStore API
  version: 1.0.0
  description: NexusStore e-commerce REST API.
servers:
  - url: /api
    description: NexusStore API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [user, admin]
        credit_card:
          type: string
        address:
          type: string
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        image_url:
          type: string
        category:
          type: string
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        total:
          type: number
        status:
          type: string
        credit_card:
          type: string
        shipping_address:
          type: string
        coupon_code:
          type: string
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin
      responses:
        '200':
          description: Returns JWT token and user object
        '401':
          description: Invalid credentials
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: newuser
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: password123
      responses:
        '201':
          description: User created
  /auth/reset:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                token:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Reset token sent or password updated
  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - name: q
          in: query
          schema:
            type: string
            example: headphones
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Array of products
  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "1"
      responses:
        '200':
          description: Product with reviews
  /reviews:
    post:
      tags: [Products]
      summary: Submit a product review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                  example: 1
                rating:
                  type: integer
                  example: 5
                body:
                  type: string
                  example: "Great product, highly recommend!"
      responses:
        '201':
          description: Review created
  /cart/{userId}:
    get:
      tags: [Cart]
      summary: Get cart for user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cart contents
    put:
      tags: [Cart]
      summary: Update cart
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                  example: 1
                quantity:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Cart updated
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /users/{id}:
    get:
      tags: [Users]
      summary: Get user profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [Users]
      summary: Update user profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                credit_card:
                  type: string
      responses:
        '200':
          description: Profile updated
  /admin/import-image:
    post:
      tags: [Admin]
      summary: Import product image from URL
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            example: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
      responses:
        '200':
          description: Image imported
  /admin/plugins:
    post:
      tags: [Admin]
      summary: Install plugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plugin_url:
                  type: string
                  example: "https://plugins.nexusstore.io/analytics/latest.js"
                settings:
                  type: string
                  example: '{"theme":"dark"}'
      responses:
        '200':
          description: Plugin installed
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Registered webhooks
    post:
      tags: [Webhooks]
      summary: Register webhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  example: "https://myapp.example.com/webhooks/orders"
      responses:
        '201':
          description: Webhook registered
  /uploads:
    get:
      tags: [Admin]
      summary: List uploaded files
      responses:
        '200':
          description: File listing
  /debug/info:
    get:
      tags: [Admin]
      summary: Application health and configuration
      responses:
        '200':
          description: System information
  /reset:
    post:
      tags: [Admin]
      summary: Reset database
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Database reset
